<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copa do Mundo 2026 - Jogos Ao Vivo</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:linear-gradient(135deg,#001d3d,#003566,#001d3d);
    min-height:100vh;
    color:white;
}

header{
    text-align:center;
    padding:40px 20px;
}

.logo{
    font-size:4rem;
    animation:pulse 2s infinite;
}

h1{
    font-size:3rem;
    margin-top:10px;
    color:#ffd60a;
}

.subtitle{
    opacity:.8;
}

@keyframes pulse{
    0%{transform:scale(1)}
    50%{transform:scale(1.1)}
    100%{transform:scale(1)}
}

.container{
    width:95%;
    max-width:1300px;
    margin:auto;
    padding-bottom:50px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
    gap:25px;
}

.card{
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,.2);
    border-radius:25px;
    padding:25px;
    transition:.3s;
    position:relative;
    overflow:hidden;
}

.card:hover{
    transform:translateY(-8px);
    box-shadow:0 0 25px rgba(255,214,10,.4);
}

.status{
    position:absolute;
    top:15px;
    right:15px;
    padding:6px 14px;
    border-radius:50px;
    font-size:.8rem;
    font-weight:600;
}

.future{
    background:#00b4d8;
}

.finished{
    background:#2dc653;
}

.live{
    background:#ff0000;
    animation:blink 1s infinite;
}

@keyframes blink{
    50%{opacity:.5}
}

.teams{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:25px;
}

.team{
    text-align:center;
    width:40%;
}

.flag{
    font-size:3rem;
}

.name{
    margin-top:10px;
    font-weight:600;
}

.score{
    font-size:3rem;
    font-weight:bold;
    color:#ffd60a;
}

.date{
    text-align:center;
    margin-top:20px;
    font-size:1.1rem;
}

.countdown{
    margin-top:15px;
    text-align:center;
    color:#ffd60a;
    font-weight:600;
}

footer{
    text-align:center;
    padding:30px;
    opacity:.7;
}
</style>
</head>
<body>

<header>
    <div class="logo">⚽🏆</div>
    <h1>COPA 2026</h1>
    <p class="subtitle">Calendário oficial e resultados em tempo real</p>
</header>

<div class="container">
    <div class="grid" id="matches"></div>
</div>

<footer>
    Atualização automática em tempo real
</footer>

<script>

// EXEMPLO DE DADOS
// Substitua pela API oficial

let jogos = [
{
    home:"Brasil",
    away:"Argentina",
    homeFlag:"🇧🇷",
    awayFlag:"🇦🇷",
    date:"2026-06-12T20:00:00",
    status:"future"
},
{
    home:"França",
    away:"Alemanha",
    homeFlag:"🇫🇷",
    awayFlag:"🇩🇪",
    date:"2025-05-20T18:00:00",
    status:"finished",
    scoreHome:2,
    scoreAway:1
}
];

function renderGames(){

    const container = document.getElementById("matches");
    container.innerHTML = "";

    jogos.forEach((game,index)=>{

        let statusLabel = "";
        let statusClass = "";

        if(game.status==="future"){
            statusLabel="EM BREVE";
            statusClass="future";
        }

        if(game.status==="live"){
            statusLabel="AO VIVO";
            statusClass="live";
        }

        if(game.status==="finished"){
            statusLabel="ENCERRADO";
            statusClass="finished";
        }

        let scoreDisplay =
            game.status==="finished" || game.status==="live"
            ? `${game.scoreHome ?? 0} x ${game.scoreAway ?? 0}`
            : "VS";

        container.innerHTML += `
        <div class="card">

            <div class="status ${statusClass}">
                ${statusLabel}
            </div>

            <div class="teams">

                <div class="team">
                    <div class="flag">${game.homeFlag}</div>
                    <div class="name">${game.home}</div>
                </div>

                <div class="score">
                    ${scoreDisplay}
                </div>

                <div class="team">
                    <div class="flag">${game.awayFlag}</div>
                    <div class="name">${game.away}</div>
                </div>

            </div>

            <div class="date">
                ${new Date(game.date).toLocaleString('pt-BR')}
            </div>

            <div class="countdown" id="countdown-${index}">
            </div>

        </div>
        `;
    });

    updateCountdowns();
}

function updateCountdowns(){

    jogos.forEach((game,index)=>{

        const el = document.getElementById(`countdown-${index}`);
        if(!el) return;

        if(game.status !== "future"){
            el.innerHTML = "";
            return;
        }

        const now = new Date();
        const target = new Date(game.date);

        const diff = target - now;

        if(diff <= 0){

            game.status = "finished";

            game.scoreHome = 0;
            game.scoreAway = 0;

            renderGames();
            return;
        }

        const days = Math.floor(diff/(1000*60*60*24));
        const hours = Math.floor(diff/(1000*60*60)%24);
        const minutes = Math.floor(diff/(1000*60)%60);
        const seconds = Math.floor(diff/1000%60);

        el.innerHTML =
        `⏳ ${days}d ${hours}h ${minutes}m ${seconds}s`;
    });

}

setInterval(updateCountdowns,1000);

renderGames();
